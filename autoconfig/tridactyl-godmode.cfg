// Firefox skips the first line of an AutoConfig file.
(() => {
  "use strict";

  const LOG_PREFIX = "[tridactyl-godmode]";
  const MOZILLA_ADDONS = "mozillaAddons";
  const INTERNAL_MATCHES = Object.freeze([
    "about:*",
    "chrome://*/*",
    "resource://*/*",
    "view-source:*",
  ]);
  const INTERNAL_MATCH_SET = new Set(INTERNAL_MATCHES);
  const TRIDACTYL_IDS = new Set([
    "tridactyl.vim@cmcaine.co.uk",
    "tridactyl.vim.betas@cmcaine.co.uk",
    "tridactyl.vim.betas.nonewtab@cmcaine.co.uk",
  ]);
  const PATCH_MARK = Symbol.for("tridactyl-godmode.patch-installed");
  const ORIGINAL_STATE = Symbol.for("tridactyl-godmode.original-state");

  try {
    const { Services } = ChromeUtils.importESModule(
      "resource://gre/modules/Services.sys.mjs"
    );
    const { Extension } = ChromeUtils.importESModule(
      "resource://gre/modules/Extension.sys.mjs"
    );
    const { ExtensionParent } = ChromeUtils.importESModule(
      "resource://gre/modules/ExtensionParent.sys.mjs"
    );
    const { ExtensionUtils } = ChromeUtils.importESModule(
      "resource://gre/modules/ExtensionUtils.sys.mjs"
    );
    const { StartupCache } = ExtensionParent;
    const prototype = Extension?.prototype;

    function log(message) {
      Services.console.logStringMessage(`${LOG_PREFIX} ${message}`);
    }

    function report(error) {
      Components.utils.reportError(
        `${LOG_PREFIX} ${error?.stack || error}`
      );
    }

    function isTarget(extension) {
      return (
        TRIDACTYL_IDS.has(extension?.id) &&
        extension.addonData?.type === "extension" &&
        !extension.temporarilyInstalled
      );
    }

    function unique(values, additions) {
      return Array.from(new Set([...values, ...additions]));
    }

    function isSet(value) {
      return ChromeUtils.getClassName(value) === "Set";
    }

    function addInternalMatches(scripts) {
      let changed = false;
      const result = scripts.map(script => {
        if (
          !Array.isArray(script.matches) ||
          !script.matches.includes("<all_urls>")
        ) {
          return script;
        }
        changed = true;
        return {
          ...script,
          matches: unique(script.matches, INTERNAL_MATCHES),
        };
      });

      if (!changed) {
        throw new Error("Tridactyl no longer has an <all_urls> content script");
      }
      return result;
    }

    function augment(extension) {
      if (!isSet(extension.permissions)) {
        throw new Error("Unexpected Extension.permissions representation");
      }
      if (!Array.isArray(extension.allowedOrigins?.patterns)) {
        throw new Error("Unexpected Extension.allowedOrigins representation");
      }
      if (!Array.isArray(extension.contentScripts)) {
        throw new Error("Unexpected Extension.contentScripts representation");
      }
      if (
        !Array.isArray(extension.manifest?.permissions) ||
        !Array.isArray(extension.manifest?.content_scripts)
      ) {
        throw new Error("Unexpected normalized Tridactyl manifest");
      }

      const permissions = new Set(extension.permissions);
      permissions.add(MOZILLA_ADDONS);

      const origins = unique(
        extension.allowedOrigins.patterns.map(pattern => pattern.pattern),
        INTERNAL_MATCHES
      );
      const allowedOrigins = ExtensionUtils.parseMatchPatterns(origins, {
        ignorePath: true,
        restrictSchemes: false,
      });
      const contentScripts = addInternalMatches(extension.contentScripts);
      const manifest = {
        ...extension.manifest,
        permissions: unique(extension.manifest.permissions, [
          MOZILLA_ADDONS,
          ...INTERNAL_MATCHES,
        ]),
        content_scripts: addInternalMatches(
          extension.manifest.content_scripts
        ),
      };

      extension.permissions = permissions;
      extension.allowedOrigins = allowedOrigins;
      extension.contentScripts = contentScripts;
      extension.manifest = manifest;
    }

    function stripSynthetic(collection, values) {
      if (isSet(collection)) {
        return new Set(
          Array.from(collection).filter(value => !values.has(value))
        );
      }
      if (Array.isArray(collection)) {
        return collection.filter(value => !values.has(value));
      }
      return collection;
    }

    function sanitizeManifestData(data) {
      if (!data || typeof data !== "object") {
        return data;
      }

      const result = { ...data };
      if ("permissions" in result) {
        result.permissions = stripSynthetic(
          result.permissions,
          new Set([MOZILLA_ADDONS])
        );
      }
      if ("originPermissions" in result) {
        result.originPermissions = stripSynthetic(
          result.originPermissions,
          INTERNAL_MATCH_SET
        );
      }
      return result;
    }

    function rememberOriginalState(extension) {
      if (!extension[ORIGINAL_STATE]) {
        Object.defineProperty(extension, ORIGINAL_STATE, {
          value: {
            ignoreQuarantine: extension.ignoreQuarantine,
            isPrivileged: extension.isPrivileged,
          },
        });
      }
    }

    function restoreOriginalState(extension) {
      const state = extension[ORIGINAL_STATE];
      if (state) {
        extension.ignoreQuarantine = state.ignoreQuarantine;
        extension.isPrivileged = state.isPrivileged;
        if (state.fields) {
          Object.assign(extension, state.fields);
        }
      }
    }

    if (prototype?.[PATCH_MARK]) {
      log("runtime hook is already installed");
      return;
    }
    if (
      !prototype ||
      typeof prototype.startup !== "function" ||
      typeof prototype.loadManifest !== "function" ||
      typeof prototype._setupStartupPermissions !== "function" ||
      typeof StartupCache?.clearAddonData !== "function" ||
      typeof StartupCache?.manifests?.set !== "function" ||
      typeof ExtensionUtils?.parseMatchPatterns !== "function" ||
      typeof ChromeUtils.getClassName !== "function"
    ) {
      throw new Error("Unsupported Firefox extension internals");
    }

    const originalStartup = prototype.startup;
    const originalLoadManifest = prototype.loadManifest;
    const originalSetupStartupPermissions =
      prototype._setupStartupPermissions;
    const originalManifestCacheSet = StartupCache.manifests.set;

    prototype.startup = function (...args) {
      const targeted = isTarget(this);
      if (targeted) {
        try {
          rememberOriginalState(this);
          this.isPrivileged = true;
          this.ignoreQuarantine = true;
          this.startupClearCachePromise = Promise.resolve(
            this.startupClearCachePromise
          ).then(() => StartupCache.clearAddonData(this.id));
        } catch (error) {
          restoreOriginalState(this);
          report(error);
        }
      }

      let result;
      try {
        result = originalStartup.apply(this, args);
      } catch (error) {
        if (targeted) {
          restoreOriginalState(this);
        }
        throw error;
      }
      if (!targeted || typeof result?.catch !== "function") {
        return result;
      }
      return result.catch(error => {
        restoreOriginalState(this);
        throw error;
      });
    };

    prototype.loadManifest = async function (...args) {
      let result;
      try {
        result = await originalLoadManifest.apply(this, args);
      } catch (error) {
        if (isTarget(this)) {
          restoreOriginalState(this);
        }
        throw error;
      }
      if (!isTarget(this) || !this[ORIGINAL_STATE]) {
        return result;
      }

      const originalFields = {
        allowedOrigins: this.allowedOrigins,
        contentScripts: this.contentScripts,
        manifest: this.manifest,
        permissions: this.permissions,
      };
      this[ORIGINAL_STATE].fields = originalFields;
      try {
        augment(this);
        log(`enabled internal-page access for ${this.id}`);
        return this.manifest;
      } catch (error) {
        restoreOriginalState(this);
        report(error);
        return result;
      }
    };

    prototype._setupStartupPermissions = function (...args) {
      const state = this[ORIGINAL_STATE];
      if (!isTarget(this) || !state) {
        return originalSetupStartupPermissions.apply(this, args);
      }

      const runtimePrivilege = this.isPrivileged;
      this.isPrivileged = state.isPrivileged;
      try {
        return originalSetupStartupPermissions.apply(this, args);
      } finally {
        this.isPrivileged = runtimePrivilege;
      }
    };

    StartupCache.manifests.set = function (path, value) {
      if (Array.isArray(path) && TRIDACTYL_IDS.has(path[0])) {
        value = sanitizeManifestData(value);
      }
      return originalManifestCacheSet.call(this, path, value);
    };

    Object.defineProperty(prototype, PATCH_MARK, { value: true });
    log("installed targeted runtime hook");
  } catch (error) {
    Components.utils.reportError(
      `${LOG_PREFIX} failed to install: ${error?.stack || error}`
    );
  }
})();
